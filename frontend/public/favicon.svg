<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Fondo Negro Carbón -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181B" />
      <stop offset="100%" stop-color="#09090B" />
    </linearGradient>

    <!-- Degradado Plateado Metálico -->
    <linearGradient id="silverGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="25%" stop-color="#E2E8F0" />
      <stop offset="50%" stop-color="#94A3B8" />
      <stop offset="75%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#64748B" />
    </linearGradient>

    <!-- Degradado Azul Eléctrico -->
    <linearGradient id="blueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#60A5FA" />
      <stop offset="100%" stop-color="#2563EB" />
    </linearGradient>

    <!-- Resplandor Azul Suave -->
    <filter id="blueGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Sombra General -->
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#000000" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Contenedor Redondeado -->
  <rect width="512" height="512" rx="120" fill="url(#bgGrad)" />

  <g filter="url(#dropShadow)">
    <!-- Anillo Plateado Exterior -->
    <circle cx="256" cy="256" r="170" fill="none" stroke="url(#silverGrad)" stroke-width="16" stroke-linecap="round" />

    <!-- Pétalos de la Flor en Plata -->
    <path d="M 256,256 C 210,256 160,220 180,165 C 200,120 250,150 256,256 Z" fill="url(#silverGrad)" opacity="0.95" />
    <path d="M 256,256 C 302,256 352,220 332,165 C 312,120 262,150 256,256 Z" fill="url(#silverGrad)" opacity="0.8" />
    <path d="M 256,256 C 200,260 170,300 200,335 C 230,365 250,310 256,256 Z" fill="url(#silverGrad)" opacity="0.85" />
    <path d="M 256,256 C 312,260 342,300 312,335 C 282,365 262,310 256,256 Z" fill="url(#silverGrad)" opacity="0.75" />

    <!-- Tallo y Hoja -->
    <path d="M 256,256 C 254,320 250,380 270,410" fill="none" stroke="url(#silverGrad)" stroke-width="12" stroke-linecap="round" />
    <path d="M 262,340 C 290,330 310,300 300,280 C 280,285 265,310 262,340 Z" fill="url(#silverGrad)" />

    <!-- Detalle de Gema Azul -->
    <circle cx="256" cy="86" r="14" fill="url(#blueGrad)" filter="url(#blueGlow)" />
    <circle cx="256" cy="86" r="14" fill="none" stroke="url(#silverGrad)" stroke-width="3" />

    <!-- Destellos Azul / Blanco -->
    <path d="M 220,135 Q 220,150 235,150 Q 220,150 220,165 Q 220,150 205,150 Q 220,150 220,135 Z" fill="url(#blueGrad)" filter="url(#blueGlow)" />
    <path d="M 290,120 Q 290,130 300,130 Q 290,130 290,140 Q 290,130 280,130 Q 290,130 290,120 Z" fill="#FFFFFF" opacity="0.9" />
  </g>
</svg>
